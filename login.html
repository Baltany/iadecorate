<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IA Decorate</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Título -->
      <h1 class="auth-title">IA DECORATE</h1>

      <!-- Formulario de Login -->
      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email:</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            name="email" 
            placeholder="tu@email.com"
            required
          >
          <div class="invalid-feedback">
            Por favor, ingresa un email válido.
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password" class="form-label">Contraseña:</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            required
          >
          <div class="invalid-feedback">
            Por favor, ingresa tu contraseña.
          </div>
        </div>

        <!-- Botón Log in -->
        <button type="submit" class="btn btn-auth btn-auth-primary">
          Log in
        </button>
      </form>
      <br>
      <br>

      <!-- Links de ayuda -->
      <div class="auth-links">
        <a href="olvidado.html" class="auth-link">¿Olvidaste tu contraseña?</a>
        <a href="register.html" class="auth-link">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Script de validación -->
  <script>
    // Validación del formulario
    (function () {
      'use strict';
      const form = document.getElementById('loginForm');
      
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        
        // Limpiar validaciones anteriores
        const controls = form.querySelectorAll('.form-control');
        controls.forEach(control => {
          control.classList.remove('is-invalid');
        });

        // Validar email
        const email = document.getElementById('email');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!email.value.trim()) {
          email.classList.add('is-invalid');
          return;
        }
        
        if (!emailRegex.test(email.value)) {
          email.classList.add('is-invalid');
          return;
        }

        // Validar contraseña
        const password = document.getElementById('password');
        if (!password.value.trim()) {
          password.classList.add('is-invalid');
          return;
        }

        // Si pasa todas las validaciones
        console.log('Formulario válido:', {
          email: email.value,
          password: password.value
        });
        alert('Formulario enviado correctamente');
        // Aquí iría la llamada al servidor
      });

      // Limpiar validación al escribir
      const inputs = form.querySelectorAll('.form-control');
      inputs.forEach(input => {
        input.addEventListener('input', function() {
          this.classList.remove('is-invalid');
        });
      });
    })();
  </script>
</body>
</html>
