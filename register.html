<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - IA Decorate</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Título -->
      <h1 class="auth-title">REGÍSTRATE EN<br>IA DECORATE</h1>

      <!-- Formulario de Registro -->
      <form id="registerForm" novalidate>
        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre" class="form-label">Nombre</label>
          <input 
            type="text" 
            class="form-control" 
            id="nombre" 
            name="nombre" 
            placeholder="Tu nombre"
            required
          >
          <div class="invalid-feedback">
            Por favor, ingresa tu nombre.
          </div>
        </div>

        <!-- Apellidos -->
        <div class="form-group">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input 
            type="text" 
            class="form-control" 
            id="apellidos" 
            name="apellidos" 
            placeholder="Tus apellidos"
            required
          >
          <div class="invalid-feedback">
            Por favor, ingresa tus apellidos.
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            name="email" 
            placeholder="tu@email.com"
            required
          >
          <div class="invalid-feedback">
            Por favor, ingresa un email válido.
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            required
          >
          <div class="invalid-feedback">
            Por favor, ingresa una contraseña.
          </div>
        </div>

        <!-- Botones -->
        <div style="display: flex; gap: 15px; margin-top: 30px;">
          <button type="submit" class="btn btn-auth btn-auth-primary" style="flex: 1;">
            Aceptar
          </button>
          <button type="reset" class="btn btn-auth btn-auth-secondary" style="flex: 1;">
            Cancelar
          </button>
        </div>
      </form>

      <!-- Link de login -->
      <div class="auth-footer-text">
        ¿Ya tienes cuenta? 
        <a href="login.html">Inicia sesión aquí</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Script de validación -->
  <script>
    (function () {
      'use strict';
      const form = document.getElementById('registerForm');
      
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        
        // Limpiar validaciones anteriores
        const controls = form.querySelectorAll('.form-control');
        controls.forEach(control => {
          control.classList.remove('is-invalid');
        });

        let isValid = true;

        // Validar nombre
        const nombre = document.getElementById('nombre');
        if (!nombre.value.trim()) {
          nombre.classList.add('is-invalid');
          isValid = false;
        }

        // Validar apellidos
        const apellidos = document.getElementById('apellidos');
        if (!apellidos.value.trim()) {
          apellidos.classList.add('is-invalid');
          isValid = false;
        }

        // Validar email
        const email = document.getElementById('email');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!email.value.trim()) {
          email.classList.add('is-invalid');
          isValid = false;
        } else if (!emailRegex.test(email.value)) {
          email.classList.add('is-invalid');
          isValid = false;
        }

        // Validar contraseña
        const password = document.getElementById('password');
        if (!password.value.trim()) {
          password.classList.add('is-invalid');
          isValid = false;
        } else if (password.value.length < 6) {
          password.classList.add('is-invalid');
          password.nextElementSibling.textContent = 'La contraseña debe tener al menos 6 caracteres.';
          isValid = false;
        }

        if (isValid) {
          console.log('Formulario válido:', {
            nombre: nombre.value,
            apellidos: apellidos.value,
            email: email.value,
            password: password.value
          });
          alert('¡Registro exitoso! Bienvenido a IA Decorate');
          // Aquí iría la llamada al servidor
        }
      });

      // Limpiar validación al escribir
      const inputs = form.querySelectorAll('.form-control');
      inputs.forEach(input => {
        input.addEventListener('input', function() {
          this.classList.remove('is-invalid');
        });
      });

      // Limpiar formulario cuando se hace click en Cancelar
      const resetBtn = form.querySelector('button[type="reset"]');
      resetBtn.addEventListener('click', function() {
        const controls = form.querySelectorAll('.form-control');
        controls.forEach(control => {
          control.classList.remove('is-invalid');
        });
      });
    })();
  </script>
</body>
</html>
