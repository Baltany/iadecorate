<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - IA Decorate</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Título -->
      <h1 class="auth-title">Recuperación de la contraseña</h1>

      <!-- Subtítulo -->
      <p class="auth-subtitle">CAMBIA TU CONTRASEÑA:</p>

      <!-- Formulario de Recuperación -->
      <form id="recoveryForm" novalidate>
        <!-- Descripción -->
        <p style="font-size: 14px; text-align: center; margin-bottom: 25px; color: var(--text-light); line-height: 1.5;">
          Indica tu correo electrónico y sigue las instrucciones que se envían por correo.
        </p>

        <!-- Email -->
        <div class="form-group">
          <div style="position: relative;">
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              name="email" 
              placeholder="Tu email"
              required
              style="padding-right: 50px;"
            >
            <span style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; cursor: pointer; color: var(--text-dark);">
              ✉️
            </span>
          </div>
          <div class="invalid-feedback">
            Por favor, ingresa un email válido.
          </div>
        </div>

        <!-- Botón Enviar -->
        <button type="submit" class="btn btn-auth btn-auth-primary">
          Enviar
        </button>
      </form>

      <!-- Links de ayuda -->
      <div class="auth-footer-text">
        <a href="login.html">Volver al login</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Script de validación -->
  <script>
    (function () {
      'use strict';
      const form = document.getElementById('recoveryForm');
      
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        
        // Limpiar validaciones anteriores
        const email = document.getElementById('email');
        email.classList.remove('is-invalid');

        // Validar email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        if (!email.value.trim()) {
          email.classList.add('is-invalid');
          return;
        }
        
        if (!emailRegex.test(email.value)) {
          email.classList.add('is-invalid');
          return;
        }

        // Si pasa todas las validaciones
        console.log('Email para recuperación:', email.value);
        alert('Se ha enviado un email a ' + email.value + ' con las instrucciones para recuperar tu contraseña.');
        
        // Limpiar el formulario
        form.reset();
        
        // Aquí iría la llamada al servidor
      });

      // Limpiar validación al escribir
      const email = form.querySelector('.form-control');
      email.addEventListener('input', function() {
        this.classList.remove('is-invalid');
      });
    })();
  </script>
</body>
</html>
