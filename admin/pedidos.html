<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Decorate - CRUD Usuarios</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===========================
       VARIABLES
       =========================== */
    :root {
      --primary-color: #EED09D;
      --text-dark: #1a1a1a;
      --text-light: #666;
      --white: #ffffff;
    }

    body {
      margin: 0;
      background-color: #f5f5f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ===========================
       LAYOUT
       =========================== */
    .main-content {
      padding: 0 30px 40px;
    }

    /* ===========================
       CRUD HEADER
       =========================== */
    .crud-header {
      width: 100%;
      background-color: var(--primary-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .crud-header-left,
    .crud-header-right {
      display: flex;
      gap: 20px;
      font-size: 20px;
      color: var(--text-dark);
    }

    .crud-header i {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .crud-header i:hover {
      transform: scale(1.15);
    }

    /* ===========================
       CRUD CONTAINER
       =========================== */
    .crud-container {
      background-color: var(--white);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      max-width: 1200px;
      margin: 0 auto;
    }

    .crud-title {
      margin-bottom: 20px;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* ===========================
       TABLE
       =========================== */
    .crud-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    .crud-table th,
    .crud-table td {
      border: 1px solid #999;
      padding: 18px;
      text-align: center;
      font-size: 14px;
      vertical-align: middle;
    }

    .crud-table th {
      font-weight: 700;
    }

    /* ===========================
       ACTIONS
       =========================== */
    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .actions i {
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.2s ease;
    }

    .actions i:hover {
      transform: scale(1.2);
    }

    /* ===========================
       RESPONSIVE
       =========================== */
    @media (max-width: 768px) {
      .crud-container {
        padding: 20px;
      }

      .actions {
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- SUB HEADER CRUD -->
  <div class="crud-header">
    <div class="crud-header-left">
      <i class="fas fa-user"></i>
      <i class="fas fa-desktop"></i>
      <i class="fas fa-envelope"></i>
    </div>

    <div class="crud-header-right">
      <i class="fas fa-arrow-right-from-bracket"></i>
    </div>
  </div>

  <!-- CONTENIDO -->
  <main class="main-content">

    <div class="crud-container">
      <h5 class="crud-title">CRUD Usuarios (PC)</h5>

      <div class="table-responsive">
        <table class="table crud-table">
          <thead>
            <tr>
              <th>Campo1</th>
              <th>Campo2</th>
              <th>Campo3</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Campo1</td>
              <td>Campo2</td>
              <td>Campo3</td>
              <td>
                <div class="actions">
                  <i class="fas fa-plus"></i>
                  <i class="fas fa-pen"></i>
                  <i class="fas fa-trash"></i>
                </div>
              </td>
            </tr>
            <tr>
              <td>Campo1</td>
              <td>Campo2</td>
              <td>Campo3</td>
              <td>
                <div class="actions">
                  <i class="fas fa-plus"></i>
                  <i class="fas fa-pen"></i>
                  <i class="fas fa-trash"></i>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

</body>
</html>
